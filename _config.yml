# Site settings
title: "Haim Cohen, Ed.D. — Résumé"
description: "Résumé of Haim Cohen, computer science educator."

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Haim Cohen, Ed.D."
resume_title:                   "Computer Science &amp; Mathematics Educator"

# used for the contact button in _layouts/resume.html
resume_contact_email:           "cohenh@gmail.com"

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_telephone:       ""
resume_contact_address:         "Highland Park, NJ"

resume_header_contact_info:     "Highland Park, NJ • chaimtime.com • cohenh@gmail.com"
display_header_contact_info:    "false"

resume_header_intro: "<p>Seasoned computer science and mathematics teacher of over 20 years in the public-school classroom. Experience building course sequences, expanding programs, and making decisions based on student outcomes. Partners with administration on curriculum, placement, and program development. Doctoral research focused on course sequencing and how placement decisions affect student outcomes through a lens of pragmatism.</p>"

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
# resume_looking_for_work:        "yes"

# Decide which sections to use
# comment out to hide
resume_section_experience:      true
resume_section_education:       true
resume_section_projects:        true
resume_section_skills:          true
resume_section_recognition:     true
# resume_section_links:           true
resume_section_associations:    true
# resume_section_interests:       true

# Resume social links
# uncomment the options you wish to display, and add your own URL
resume_social_links:
  resume_github_url:            "https://github.com/chaimtime"
  resume_linkedin_url:          "https://www.linkedin.com/in/cohenh"
  resume_mastodon_url:          "https://infosec.exchange/@chaimtime"
  resume_website_url:           "https://chaimtime.com"

resume_print_social_links:      true

# Design settings
resume_theme:                   default

